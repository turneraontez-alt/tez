#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - python3
  - python3-pip
  - python3-venv
  - sqlite3
  - ufw
  - util-linux

write_files:
  - path: /etc/ssh/sshd_config.d/99-q15-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password

runcmd:
  - [git, clone, --branch, main, --single-branch, "https://github.com/turneraontez-alt/tez.git", /tmp/q15-bootstrap]
  - [bash, /tmp/q15-bootstrap/scripts/cloud/install-q15.sh]
  - [systemctl, restart, ssh]

final_message: "Q15 prerequisites are installed; secrets and runtime state are still required."
